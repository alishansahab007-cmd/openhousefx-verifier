# Optional Render Blueprint. No persistent disk or database is provisioned.
# For an existing service, use the README settings instead of creating a second service.
services:
  - type: web
    name: openhousefx-verifier
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
