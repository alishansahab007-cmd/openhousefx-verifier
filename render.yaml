# Optional Render Blueprint. Note: Render blocks outbound port 25 on every plan, so the
# mailbox (SMTP) check is skipped there unless you set ZEROBOUNCE_API_KEY. All other checks work.
services:
  - type: web
    name: openhousefx-verifier
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ZEROBOUNCE_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
